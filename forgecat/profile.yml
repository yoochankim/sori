    tested: [cursor, claude-code, codex, openclaw, hermes]

instructions:
  operatingRef: sori-agent

references:
  - id: sori-agent
    path: AGENTS.md
    type: operating-instructions

skills:
  - name: sori-recorder
    path: skills/sori-recorder/SKILL.md
    description: >-
      Operate the installed Sori macOS recorder and hand a verified recording
      to a user-approved follow-up workflow. Use when the user asks to start or
      stop recording, check status or audio levels, choose a microphone, list
      or verify recordings, or continue work from a Sori recording. This skill
      does not transcribe audio or change Sori source code.
